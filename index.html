<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Кинополка</title>
    <meta name="description" content="Библиотека фильмов без трейлеров и рекламы: только название и о чём кино." />
    <meta name="theme-color" content="#7b1e2e" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237b1e2e'/%3E%3Cpath d='M13 10.5v11l9-5.5z' fill='%23f7efe4'/%3E%3C/svg%3E" />
    <script>
      // Тема ставится до загрузки страницы, чтобы не было «вспышки». По умолчанию — молочная.
      try {
        if (JSON.parse(localStorage.getItem('kp-theme-v2') || 'null') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
